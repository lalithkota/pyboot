[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[project]
name = "pyboot-fastapi"
authors = [{ name = "Lalith Kota" }]
description = "Pyboot module for initializing FastAPI Backend elements"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyboot-core",
    "fastapi >=0.103.1",
    "uvicorn[standard] >=0.12.0",
    "gunicorn >=22.0.0",
    "pydantic-extra-types >=2.0.0",
    "python-multipart >=0.0.5",
    "json-logging >=1.3.0",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://lalithkota.github.io/pyboot/docs/"
Repository = "https://github.com/lalithkota/pyboot"
Source = "https://github.com/lalithkota/pyboot"

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.targets.wheel]
packages = ["src/pyboot/fastapi"]

[tool.versioningit]
default-version = "0.0.0+unknown"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}+{branch}.{vcs}{rev}"
distance-dirty = "{next_version}.dev{distance}+{branch}.{vcs}{rev}.dirty"

[tool.versioningit.next-version]
method = "smallest"
