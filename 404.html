<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyboot - 404 Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f5f5f4;
        }
        ::-webkit-scrollbar-thumb {
            background: #d6d3d1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a29e;
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 antialiased selection:bg-amber-200 selection:text-amber-900 min-h-screen">
    <div class="max-w-4xl mx-auto px-6 sm:px-12 md:px-16 py-10 sm:py-16 space-y-10 sm:space-y-14">

        <section class="flex items-center justify-between border-b border-stone-200/80 pb-6">
            <h1 class="flex items-center gap-3 text-2xl sm:text-3xl md:text-4xl font-light text-stone-900 tracking-tight leading-[1.15]">
                <span class="w-8 h-8 rounded-lg bg-stone-900 text-stone-50 font-bold text-xs flex items-center justify-center tracking-wider">P</span>
                <span class="font-semibold text-stone-900">Pyboot</span>
            </h1>
        </section>

        <section class="space-y-6 pt-6">
            <div class="space-y-3">
                <h2 class="text-m font-semibold tracking-widest text-amber-800 uppercase">404 — Page Not Found</h2>
                <h3 class="text-3xl sm:text-4xl font-semibold text-stone-900 tracking-tight">Lost in the stack?</h3>
            </div>

            <div class="gap-8 text-stone-600 leading-relaxed font-light">
                <p>
                    The page you are looking for doesn't exist, or may have been moved.
                    Double-check the URL or return to the home page.
                </p>
            </div>

            <div class="pt-4">
                <a href="/pyboot" class="inline-flex items-center justify-center bg-stone-900 hover:bg-stone-800 text-stone-50 font-medium text-sm px-5 py-2.5 rounded-lg transition-colors gap-2">
                    &larr; Back to Pyboot Home
                </a>
            </div>
        </section>

        <footer class="pt-12 text-xs text-stone-400 border-t border-stone-200/60">
            <p>© 2026 Pyboot. Licensed under <a href="/LICENSE.html" class="hover:underline">CC BY 4.0</a>.</p>
        </footer>

    </div>
</body>
</html>
