name: Tag the repo
on:
  workflow_dispatch:
    inputs:
      new-tag:
        description: Tag name in "vN.N.N" format
        required: true
        type: string
      new-tag-message:
        description: Tag message
        required: true
        type: string
        default: New tag
jobs:
  tag-repo:
    name: Tag Repo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag convention
        run: |
          pattern="^v[0-9]+.[0-9]+.[0-9]+$"
          if ! [[ ${{ inputs.new-tag }} =~ $pattern ]]; then
            echo "Tag convention not followed"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Tag and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${{ inputs.new-tag }}" -m "${{ inputs.new-tag-message }}"
          git push origin ${{ inputs.new-tag }}
