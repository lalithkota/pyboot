<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyboot - Code Coverage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f5f5f4;
        }
        ::-webkit-scrollbar-thumb {
            background: #d6d3d1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a29e;
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 antialiased selection:bg-amber-200 selection:text-amber-900 min-h-screen">
    <div class="max-w-4xl mx-auto px-6 sm:px-12 md:px-16 py-10 sm:py-16 space-y-10 sm:space-y-14">

        <section class="flex items-center justify-between border-b border-stone-200/80 pb-6">
            <h1 class="flex items-center gap-3 text-2xl sm:text-3xl md:text-4xl font-light text-stone-900 tracking-tight leading-[1.15]">
                <span class="w-8 h-8 rounded-lg bg-stone-900 text-stone-50 font-bold text-xs flex items-center justify-center tracking-wider">P</span>
                <span class="font-semibold text-stone-900">Pyboot</span>
                <span class="text-stone-300 font-light">/</span>
                <span class="font-normal text-stone-700">Code Coverage</span>
            </h1>
            <a href="../" class="text-xs sm:text-sm font-medium text-amber-800 hover:underline flex items-center gap-1">
                &larr; Back to Pyboot
            </a>
        </section>

        <section class="space-y-6 pt-2">
            <div class="space-y-3">
                <h2 class="text-m font-semibold tracking-widest text-amber-800 uppercase">View Coverage</h2>
                <p class="text-stone-600 font-light leading-relaxed">
                    Choose a branch or pull request below to view details.
                </p>
            </div>

            <div class="bg-white border border-stone-200/80 rounded-xl p-6 shadow-sm space-y-6 max-w-lg">
                <div class="space-y-2">
                    <label for="branch-select" class="block text-xs font-semibold text-stone-500 uppercase tracking-wider">
                        Available Branches & PRs
                    </label>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <select id="branch-select" class="flex-1 bg-stone-50 border border-stone-300 text-stone-900 text-sm rounded-lg focus:ring-2 focus:ring-amber-500/20 focus:border-amber-700 p-2.5 outline-none cursor-pointer font-medium">
                            <option value="" disabled selected>Loading reports...</option>
                        </select>
                        <button id="view-btn" onclick="openReport()" class="bg-stone-900 hover:bg-stone-800 text-stone-50 font-medium text-sm px-5 py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
                            View &rarr;
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <footer class="pt-12 flex justify-between items-center text-xs text-stone-400 border-t border-stone-200/60">
            <p>© 2026 Pyboot. Licensed under <a href="../LICENSE.html" class="hover:underline">CC BY 4.0</a>.</p>
        </footer>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('branch-select');
            const reportList = document.getElementById('report-list');

            fetch('manifest.json')
                .then((res) => res.json())
                .then((data) => {
                    select.innerHTML = '';

                    if (!data.reports || data.reports.length === 0) {
                        select.innerHTML = '<option disabled>No reports found in manifest</option>';
                        return;
                    }

                    data.reports.forEach((item, index) => {
                        const targetUrl = item.path;
                        const opt = document.createElement('option');
                        opt.value = targetUrl;
                        opt.textContent = item.label;
                        if (index === 0) opt.selected = true;
                        select.appendChild(opt);
                    });
                });
        });

        function openReport() {
            const select = document.getElementById('branch-select');
            if (select.value) {
                window.location.href = select.value;
            }
        }
    </script>
</body>
</html>
