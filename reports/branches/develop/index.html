<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyboot - Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../nav.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 p-6 sm:p-12 min-h-screen flex flex-col">

    <h1 class="text-2xl font-semibold text-stone-900 tracking-tight">Pyboot Reports</h1>

    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 my-6">
        <a href="coverage" class="flex flex-col items-center justify-center bg-white border border-stone-200/80 rounded-2xl p-10 hover:border-amber-400 hover:bg-amber-50/30 transition-all shadow-sm group">
            <span class="text-3xl sm:text-4xl font-semibold text-stone-900 group-hover:text-amber-900">Coverage</span>
            <span class="text-sm font-medium text-amber-800 mt-2">View Code Coverage & Report &rarr;</span>
        </a>

        <a href="tests" class="flex flex-col items-center justify-center bg-white border border-stone-200/80 rounded-2xl p-10 hover:border-amber-400 hover:bg-amber-50/30 transition-all shadow-sm group">
            <span class="text-3xl sm:text-4xl font-semibold text-stone-900 group-hover:text-amber-900">Tests</span>
            <span class="text-sm font-medium text-amber-800 mt-2">View Test Report &rarr;</span>
        </a>

</html>
